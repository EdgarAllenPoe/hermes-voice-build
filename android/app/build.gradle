plugins { id 'com.android.application' }
def ciBuild = System.getenv('HVB_CI_BUILD') == '1'
android {
    buildFeatures { buildConfig true }
    namespace 'org.tomstout.hermesvoice'
    compileSdk 36
    defaultConfig { applicationId 'org.tomstout.hermesvoice'; minSdk 33; targetSdk 36; versionCode 3; versionName '0.3.0'
        if (ciBuild) { applicationIdSuffix '.ci'; versionNameSuffix '-ci' }
        buildConfigField 'boolean', 'CI_BUILD', ciBuild ? 'true' : 'false'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner' }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    signingConfigs {
        debug {
            def supplied = System.getenv('HVB_DEBUG_KEYSTORE')
            def personalKey = supplied ? file(supplied) : rootProject.file('../config/private/android-debug.keystore')
            if (!ciBuild && !personalKey.isFile()) {
                throw new GradleException('Restore the existing personal signing key before building. Disposable CI tests require HVB_CI_BUILD=1.')
            }
            if (supplied || !ciBuild) {
                storeFile personalKey
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
        }
    }
    buildTypes { release { minifyEnabled false } }
}

dependencies {
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
