plugins { id 'com.android.application' }
android {
    namespace 'org.tomstout.hermesvoice'
    compileSdk 36
    defaultConfig { applicationId 'org.tomstout.hermesvoice'; minSdk 33; targetSdk 36; versionCode 2; versionName '0.2.0' }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    signingConfigs {
        debug {
            def supplied = System.getenv('HVB_DEBUG_KEYSTORE')
            if (supplied) {
                storeFile file(supplied)
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
        }
    }
    buildTypes { release { minifyEnabled false } }
}
