name: Android database and pairing tests
on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android-tests.yml', 'tools/bootstrap-gradle.sh']
  pull_request:
    paths: ['android/**', '.github/workflows/android-tests.yml', 'tools/bootstrap-gradle.sh']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  emulator:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      HVB_CI_BUILD: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Android tools and KVM
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;35.0.0' </dev/null
          sudo chmod 666 /dev/kvm
          bash tools/bootstrap-gradle.sh
      - name: Run database and Bluetooth address regression tests on Android
        uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 2048M
          emulator-boot-timeout: 600
          disable-animations: true
          script: .tools/gradle-8.11.1/bin/gradle -p android --no-daemon :app:connectedDebugAndroidTest
      - name: Save test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: android-database-test-reports
          path: |
            android/app/build/reports/androidTests/
            android/app/build/outputs/androidTest-results/
          if-no-files-found: warn
