CONFIG_GPIO=y
CONFIG_I2C=y
CONFIG_MFD=y
CONFIG_LED=y
CONFIG_LED_NPM13XX=y
# RGB is driven directly by the application; PWM20 is disabled.
CONFIG_LED_GPIO=n
CONFIG_LED_PWM=n
CONFIG_REGULATOR=y
CONFIG_SENSOR=y
CONFIG_AUDIO=y
CONFIG_AUDIO_DMIC=y
CONFIG_SPI=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_SPI_NOR=y
# NVS uses 16-bit sector sizes; the SPI NOR default of 64 KiB cannot mount.
CONFIG_SPI_NOR_FLASH_LAYOUT_PAGE_SIZE=4096
CONFIG_CRC=y
CONFIG_NVS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="Hermes Voice"
CONFIG_BT_MAX_CONN=1
CONFIG_BT_MAX_PAIRED=1
CONFIG_BT_SETTINGS=y
CONFIG_BT_SMP=y
CONFIG_BT_SMP_SC_ONLY=y
CONFIG_BT_FIXED_PASSKEY=y
CONFIG_BT_SMP_APP_PAIRING_ACCEPT=y
CONFIG_BT_PRIVACY=n
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_ENTROPY_GENERATOR=y
# CSPRNG_ENABLED is a derived, non-user-configurable symbol in Zephyr 4.4.
# Request the secure generator and verify the resulting generated .config.
CONFIG_CSPRNG_NEEDED=y
CONFIG_HARDWARE_DEVICE_CS_GENERATOR=y
CONFIG_MAIN_STACK_SIZE=6144
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_HEAP_MEM_POOL_SIZE=16384
CONFIG_SERIAL=n
CONFIG_CONSOLE=n
CONFIG_PRINTK=n
CONFIG_BOOT_BANNER=n
CONFIG_ARM_MPU=n
CONFIG_ASSERT=y

# Seeed vendor-BSP BLE controller workarounds; revalidate after BSP upgrades.
CONFIG_BT_CTLR_ASSERT_OPTIMIZE_FOR_SIZE=n
CONFIG_BT_CTLR_ASSERT_DEBUG=n
CONFIG_BT_CTLR_ASSERT_OVERHEAD_START=n
CONFIG_BT_AUTO_PHY_UPDATE=n
CONFIG_BT_DATA_LEN_UPDATE=n
